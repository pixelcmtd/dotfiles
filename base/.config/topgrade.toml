[misc]
disable = ["cargo", "vim", "node", "pnpm", "yarn", "pipx", "github_cli_extensions", "mas", "system"]
cleanup = true

[git]
max_concurrency = 10
pull_predefined = false
repos = [
    "~/src/*",
    "~/src/*/*",
]

[commands]
"dotfiles" = "cd ~/src/pixelcmtd/dotfiles/base && ./run"
"tldrgal" = "tldrgal update"
